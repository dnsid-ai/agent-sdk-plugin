name: Compile Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production deps only; dev-tool advisories arrive via Dependabot instead.
      # Accepted risks: `npm audit` has no ignore flag, so document any in
      # package.json "overrides" with a comment and link to the advisory.
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript compile checks
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npx prettier --check .

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the packed package
        run: npm run smoke:pack
