# Lint, test and security scanning on every pull request, plus a push + weekly
# scan of main, from the shared workflow in dnsid-ai/github-actions. Make
# "typescript / Summary" the one required check on main.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # weekly: re-scan main with new CodeQL queries

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    uses: dnsid-ai/github-actions/.github/workflows/security-typescript.yml@0a1862bcf580a5ee06b32e464926f91db878b29f # v1.5.0
    permissions:
      contents: read # check out the code
      security-events: write # required by the called workflow's jobs
      actions: read # required by the called workflow's jobs
      pull-requests: write # the Summary job posts a sticky typescript: summary comment
    with:
      # compile.yml already runs these; don't duplicate here.
      lint: false
      test: false
      # Public repo: code scanning is free, so SARIF uploads land in the Security tab.
      # Scan this repo's own GitHub Actions workflows with CodeQL (shared v1.4.0).
      codeql-actions: true
      # Scan every commit, not just PR open: a follow-up push to an open PR
      # otherwise skips the scanners and fails Summary 'not scanned', forcing a
      # reopen. These scans are fast, so scan every push.
      scan-every-push: true
      upload-sarif: true
      # Warn-only while the first findings are triaged; flip to true after.
      enforce-security: false
